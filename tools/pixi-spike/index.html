<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixi spike — phenotype texture prototype (pixi.js v8, WebGL2 direction)</title>
<style>
body{background:#060b0f;color:#cfe0d8;font:14px/1.4 system-ui,sans-serif;margin:0 auto;max-width:1400px;padding:24px}
h1{color:#eafff3;font-size:1.1rem} .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:12px 0}
#stats{font-family:ui-monospace,monospace;font-size:.8rem;color:#9fb8ad}
canvas{image-rendering:pixelated}
select,button{font:inherit}
</style>
</head>
<body>
<h1>Pixi spike — phenotype texture prototype</h1>
<p>Prototype baseline: <span id="baseline">?</span>. Query params: <code>?fixture=0..4&amp;tier=ecosystem|population|inspection&amp;mode=pixi|canvas2d</code>.</p>
<div class="row">
<label>Mode <select id="mode"><option value="pixi">pixi</option><option value="canvas2d">canvas2d</option></select></label>
<label>Tier <select id="tier"><option value="ecosystem">ecosystem</option><option value="population" selected>population</option><option value="inspection">inspection</option></select></label>
<button id="step">Step (movement)</button>
<button id="evolve">Evolve 5%</button>
</div>
<div id="stage"></div>
<p id="stats">booting…</p>
<script type="module" src="./boot.ts"></script>
</body>
</html>
