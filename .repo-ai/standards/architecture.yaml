schema: repo-ai/v1
rules:
  - id: architecture.preserve-existing-patterns
    level: guidance
    scope: "**"
    instruction: >
      Inspect existing architecture and implementations before introducing
      a new abstraction. Prefer established repository patterns.

  - id: architecture.no-unrelated-changes
    level: guidance
    scope: "**"
    instruction: >
      Keep changes limited to the requested task.

  - id: architecture.boundaries
    level: check
    scope: "**"
    instruction: >
      Preserve existing package, service, module, and dependency boundaries
      unless the requested change explicitly requires an architectural change.
