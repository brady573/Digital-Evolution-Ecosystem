name: product

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels stale runs on the same ref: only the latest state
# consumes runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job below is a thin wrapper: it bootstraps with the shared composite
# action, then runs one shard from the canonical manifest. Which checks exist,
# which class they belong to, and whether they block are all defined in
# `tools/validation/manifest.ts` — never here. Adding a check to the repository
# is a manifest edit; this file only says which runner it lands on.
#
# `tools/validation/validation-arch.ts` (in the `quick` shard) fails the build if
# a manifest unit is not executed somewhere in CI, if a shard executes a unit
# twice, or if this file starts running validation outside the manifest.

# The revision this change is measured against, for impact routing.
#
# pull_request: the base branch tip, so the diff is exactly what the PR proposes.
# push: the previous head. A first push on a branch has no previous head, and
# that all-zeroes value is treated as "unknown", which routes to the full
# validation set -- the safe direction.
env:
  impact_base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

jobs:
  # Class A. First actionable failure: structural breakage surfaces here, in
  # about a minute, without waiting behind a long simulation.
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Impact routing diffs this change against the base revision, so both
          # revisions must be present. Depth 1 would make every change
          # unresolvable, which routes to full validation -- safe, but it would
          # silently disable the whole feature.
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - name: ci-fast
        run: pnpm ci:shard ci-fast
        env:
          DEE_IMPACT_BASE: ${{ env.impact_base }}
      - name: Upload validation summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-summary-${{ github.job }}
          path: validation-telemetry/summary.json
          if-no-files-found: ignore
          retention-days: 14

  # Class B. Shards are partitioned by measured cost, not by intuition. The
  # dependency suite used to be one 647s command that was the entire critical
  # path; its live-integration phase is now split three ways, and
  # `validation-arch.ts` proves the three shards union back to the whole suite.
  sim-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Impact routing diffs this change against the base revision, so both
          # revisions must be present. Depth 1 would make every change
          # unresolvable, which routes to full validation -- safe, but it would
          # silently disable the whole feature.
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: pnpm ci:shard ci-sim-a
        env:
          DEE_IMPACT_BASE: ${{ env.impact_base }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-summary-${{ github.job }}
          path: validation-telemetry/summary.json
          if-no-files-found: ignore
          retention-days: 14

  sim-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Impact routing diffs this change against the base revision, so both
          # revisions must be present. Depth 1 would make every change
          # unresolvable, which routes to full validation -- safe, but it would
          # silently disable the whole feature.
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: pnpm ci:shard ci-sim-b
        env:
          DEE_IMPACT_BASE: ${{ env.impact_base }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-summary-${{ github.job }}
          path: validation-telemetry/summary.json
          if-no-files-found: ignore
          retention-days: 14

  sim-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Impact routing diffs this change against the base revision, so both
          # revisions must be present. Depth 1 would make every change
          # unresolvable, which routes to full validation -- safe, but it would
          # silently disable the whole feature.
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: pnpm ci:shard ci-sim-c
        env:
          DEE_IMPACT_BASE: ${{ env.impact_base }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-summary-${{ github.job }}
          path: validation-telemetry/summary.json
          if-no-files-found: ignore
          retention-days: 14

  sim-d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Impact routing diffs this change against the base revision, so both
          # revisions must be present. Depth 1 would make every change
          # unresolvable, which routes to full validation -- safe, but it would
          # silently disable the whole feature.
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: pnpm ci:shard ci-sim-d
        env:
          DEE_IMPACT_BASE: ${{ env.impact_base }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-summary-${{ github.job }}
          path: validation-telemetry/summary.json
          if-no-files-found: ignore
          retention-days: 14

  # Class C. Built once. Everything downstream tests this exact bundle rather
  # than rebuilding it, so the APK and the browser lanes cannot disagree about
  # what "the product" is.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Impact routing diffs this change against the base revision, so both
          # revisions must be present. Depth 1 would make every change
          # unresolvable, which routes to full validation -- safe, but it would
          # silently disable the whole feature.
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: pnpm ci:shard ci-build
        env:
          DEE_IMPACT_BASE: ${{ env.impact_base }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: explorer-dist
          path: apps/explorer/dist
          retention-days: 7
      # The build lane was the one job that never uploaded a summary, so the
      # first run's merged telemetry had no cost for the build at all. Caught by
      # reading the artifact rather than by a check failing, which is exactly
      # what the artifact is for.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-summary-${{ github.job }}
          path: validation-telemetry/summary.json
          if-no-files-found: ignore
          retention-days: 14

  # Class D blocking browser validation. Visual captures (Class G) run in the
  # separate `visual` job below on their own runner: a slow or failed capture
  # must not delay or flip this merge-gating lane, and a software-GL failure
  # here cannot fail the blocking checks. Each lane pays its own Chromium
  # setup (~20s) for that isolation; the same-run explorer-dist artifact is
  # shared, not rebuilt.
  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Impact routing diffs this change against the base revision, so both
          # revisions must be present. Depth 1 would make every change
          # unresolvable, which routes to full validation -- safe, but it would
          # silently disable the whole feature.
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: pnpm ci:plan ci-browser
        id: plan
        env:
          DEE_IMPACT_BASE: ${{ env.impact_base }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.plan.outputs.ci_browser_has_work == 'true'
        with:
          name: explorer-dist
          path: apps/explorer/dist
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.plan.outputs.ci_browser_has_work == 'true'
      - name: Start one preview server for the whole browser lane
        if: steps.plan.outputs.ci_browser_has_work == 'true'
        run: |
          pnpm --filter @digital-evolution/explorer exec vite preview --host 127.0.0.1 --port 4173 >/tmp/digital-evolution-vite.log 2>&1 &
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then ready=1; break; fi
            sleep 1
          done
          # Without this the lane would continue and fail deep inside the browser
          # checks with ERR_CONNECTION_REFUSED, which reads like a product fault
          # rather than the preview server never having started.
          if [ "$ready" -ne 1 ]; then
            echo "::error::vite preview did not become ready on 127.0.0.1:4173"
            cat /tmp/digital-evolution-vite.log
            exit 1
          fi
      # Unconditional on purpose. Branch protection requires this check by name,
      # so the shard always reports; when routing left it nothing to do it says so
      # and exits green rather than disappearing.
      - name: ci-browser
        run: pnpm ci:shard ci-browser
        env:
          DEE_BASE_URL: http://127.0.0.1:4173
          DEE_IMPACT_BASE: ${{ env.impact_base }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pixi-world-proof-evidence
          path: testdata/pixi-world-proof
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-summary-${{ github.job }}
          path: validation-telemetry/summary.json
          if-no-files-found: ignore
          retention-days: 14

  # Class G landscape captures (non-gating human-review evidence). Separate
  # runner from `smoke` so capture timing can never gate merge readiness.
  # Shares the same-run explorer-dist artifact; pays its own Chromium setup.
  # Not in telemetry's needs; failure stays visible via the uploaded artifact.
  visual:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: pnpm ci:plan ci-visual
        id: plan
        env:
          DEE_IMPACT_BASE: ${{ env.impact_base }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.plan.outputs.ci_visual_has_work == 'true'
        with:
          name: explorer-dist
          path: apps/explorer/dist
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.plan.outputs.ci_visual_has_work == 'true'
      - name: Start preview server for visual captures
        if: steps.plan.outputs.ci_visual_has_work == 'true'
        run: |
          pnpm --filter @digital-evolution/explorer exec vite preview --host 127.0.0.1 --port 4173 >/tmp/digital-evolution-vite.log 2>&1 &
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::vite preview did not become ready on 127.0.0.1:4173"
            cat /tmp/digital-evolution-vite.log
            exit 1
          fi
      - name: ci-visual
        run: pnpm ci:shard ci-visual
        env:
          DEE_BASE_URL: http://127.0.0.1:4173
          DEE_IMPACT_BASE: ${{ env.impact_base }}
      - name: Report capture coverage
        if: always()
        run: cat testdata/visual/MANIFEST.json || echo "no captures, the visual lane had nothing to do for this change"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: landscape-visual-evidence
          path: testdata/visual
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-summary-${{ github.job }}
          path: validation-telemetry/summary.json
          if-no-files-found: ignore
          retention-days: 14

  # Class C remainder: presentation contracts that do not need the built bundle.
  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Impact routing diffs this change against the base revision, so both
          # revisions must be present. Depth 1 would make every change
          # unresolvable, which routes to full validation -- safe, but it would
          # silently disable the whole feature.
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: pnpm ci:shard ci-presentation
        env:
          DEE_IMPACT_BASE: ${{ env.impact_base }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-summary-${{ github.job }}
          path: validation-telemetry/summary.json
          if-no-files-found: ignore
          retention-days: 14

  # Class G. Kept on its own runner on purpose. Folding it into `smoke` would
  # lengthen the browser lane's critical path to buy nothing, because this job
  # costs ~67s of wall clock in parallel and roughly one runner-minute. It needs
  # its own preview server on a different port and its own capture harness, so
  # the two lanes stay isolated and a software-GL failure here cannot fail the
  # blocking browser lane.
  pixi-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Impact routing diffs this change against the base revision, so both
          # revisions must be present. Depth 1 would make every change
          # unresolvable, which routes to full validation -- safe, but it would
          # silently disable the whole feature.
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: pnpm ci:plan ci-pixi
        id: plan
        env:
          DEE_IMPACT_BASE: ${{ env.impact_base }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.plan.outputs.ci_pixi_has_work == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.plan.outputs.ci_pixi_has_work == 'true'
      - name: Pixi lane skipped by impact routing
        if: steps.plan.outputs.ci_pixi_has_work != 'true'
        run: echo "::notice title=Pixi lane skipped::No changed file can affect the Pixi spike, so Chromium was not installed and no captures were taken. The required checks are unaffected."
      - run: pnpm ci:shard ci-pixi
        env:
          DEE_IMPACT_BASE: ${{ env.impact_base }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pixi-spike-evidence
          path: testdata/pixi-spike
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-summary-${{ github.job }}
          path: validation-telemetry/summary.json
          if-no-files-found: ignore
          retention-days: 14

  # Class E. Called as a reusable workflow rather than triggered separately, so
  # the platform evidence is part of this same invocation: it consumes the
  # explorer-dist artifact this run's `build` job produced for this exact
  # commit. Packaging starts as soon as the build candidate and the routing
  # decision exist, in parallel with the remaining merge gates: the APK is
  # candidate evidence while validation runs, and becomes accepted evidence
  # for the revision only if the merge-gating product validation succeeds
  # (see `android_acceptance` below).
  #
  # This replaces a gate that located the product run by SHA and polled for it.
  # That approach failed three different ways in review, and `needs:` states the
  # contract directly instead of inferring it.
  #
  # `pixi-spike` and `telemetry` are deliberately NOT dependencies: the first is
  # non-gating evidence, the second summarises validation rather than
  # establishing product correctness. Neither should be able to hold up an APK.
  # Decides whether the Android lane is relevant to this change at all. A
  # separate job because a reusable-workflow caller cannot use `env` set by a
  # previous step of the same job, and `if` on the caller needs the answer.
  android_plan:
    runs-on: ubuntu-latest
    needs: [quick, build]
    # A job's `if` cannot read another job's step outputs, and workflow `env` is
    # not shared between jobs. The answer has to travel as a job output.
    outputs:
      android_apk_has_work: ${{ steps.plan.outputs.android_apk_has_work }}
      android_runtime_has_work: ${{ steps.plan.outputs.android_runtime_has_work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - name: Plan the Android lane
        id: plan
        env:
          DEE_IMPACT_BASE: ${{ env.impact_base }}
        run: pnpm ci:plan android-apk android-runtime
      # Reported so a skipped lane is visible rather than merely absent.
      - name: Android lane skipped by impact routing
        if: steps.plan.outputs.android_apk_has_work != 'true'
        run: echo "::notice title=Android lane skipped::No changed file can affect the packaged application, Android integration, or the platform contract, so no APK was assembled and no emulator was started. Required checks are unaffected."

  android:
    name: android
    needs:
      - build
      - android_plan
    uses: ./.github/workflows/android.yml
    # The impact decision is computed once in `android_plan` above and passed
    # in: the reusable workflow reuses it instead of recomputing. Manual
    # dispatches of android.yml (inputs empty) still compute internally.
    with:
      android_apk_has_work: ${{ needs.android_plan.outputs.android_apk_has_work }}
      android_runtime_has_work: ${{ needs.android_plan.outputs.android_runtime_has_work }}
    # Gated on impact and on the build candidate, not on the merge gates.
    # Android packaging overlaps the deterministic/browser/presentation lanes:
    # the APK is candidate evidence until `android_acceptance` (below) confirms
    # the product gates passed for this revision. `if` is evaluated after
    # `needs`, so without a build artifact there is nothing to package.
    #
    # The emulator runtime is paused, unconditionally: `android.yml` no longer
    # contains an `emulator-smoke` job, so there is nothing for the caller to
    # gate. Re-entry criteria live in `android.yml`. The `workflow_dispatch`
    # question stays with #50 and is not decided here.
    #
    # Not a required check, and not on any required check's critical path, so
    # packaging early cannot weaken a merge gate.
    if: ${{ needs.build.result == 'success' && needs.android_plan.outputs.android_apk_has_work == 'true' }}

  # Collects every merge-gating runner's summary into one machine-readable file
  # so "what ran, what was skipped, and what did it cost" is answerable from a
  # single artifact.
  #
  # Only merge-gating jobs are dependencies: quick, sim-a..d, build, smoke
  # (blocking browser), presentation (blocking contracts including the pixi-spike
  # unit). Non-gating evidence -- visual captures, pixi captures (job
  # `pixi-spike` runs shard `ci-pixi`, not unit `pixi-spike`), Android -- runs
  # in parallel and is NOT awaited. A slow or failed capture must not delay or
  # flip merge readiness; its failure stays visible in its own artifact.
  #
  # `android` is deliberately NOT a dependency, even though it runs in this same
  # invocation.
  #
  # It was, briefly, and that put the emulator on the critical path of a gating
  # check. The Android runtime smoke is classified as non-gating platform
  # evidence: its boot consumes 80-90% of its 1200s budget and it has failed on
  # `adb: device offline` with a healthy APK. Making a required check wait for
  # that meant an 18-minute emulator boot could hold up a summary that says
  # nothing about Android -- non-gating evidence gating a gate.
  #
  # The platform lane is still summarised whenever it succeeds; it just is not
  # waited for. If whole-run telemetry is wanted later, the shape is a second
  # `if: always()` job that merges Android's contribution after the fact, rather
  # than a required check that blocks on it.
  #
  # `if: always()` keeps the summary produced even when a product lane failed,
  # which is when a skip reason is most worth reading.
  telemetry:
    runs-on: ubuntu-latest
    needs: [quick, sim-a, sim-b, sim-c, sim-d, build, smoke, presentation]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Impact routing diffs this change against the base revision, so both
          # revisions must be present. Depth 1 would make every change
          # unresolvable, which routes to full validation -- safe, but it would
          # silently disable the whole feature.
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: validation-summary-*
          path: /tmp/validation
      - run: pnpm validation:merge /tmp/validation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-summary
          path: validation-telemetry/summary.json
          if-no-files-found: error
          retention-days: 14

  # Records whether an early-built APK is accepted evidence for this revision.
  # The android lane packages the exact candidate while merge gates still run,
  # so an APK can exist before (or despite) the product verdict. This job turns
  # that ambiguity into a machine-readable record: accepted is true only when
  # the APK assembled AND the required product gates passed for this revision.
  # A failed gate with a built APK yields accepted:false -- visibly unaccepted
  # evidence, never a product-validation claim.
  #
  # Not a required check and depended on by nothing: it observes after the
  # fact. `if: always()` so the record exists even when a lane failed or the
  # platform lane was skipped (both read as not accepted).
  android_acceptance:
    runs-on: ubuntu-latest
    needs: [android, telemetry]
    if: always()
    steps:
      - name: Record APK acceptance for this revision
        env:
          APK_RESULT: ${{ needs.android.result }}
          TELEMETRY_RESULT: ${{ needs.telemetry.result }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          accepted=false
          if [ "$APK_RESULT" = "success" ] && [ "$TELEMETRY_RESULT" = "success" ]; then accepted=true; fi
          mkdir -p android-acceptance
          {
            echo "{"
            echo "  \"revision\": \"$HEAD_SHA\","
            echo "  \"run_id\": \"$RUN_ID\","
            echo "  \"apk\": \"$APK_RESULT\","
            echo "  \"telemetry\": \"$TELEMETRY_RESULT\","
            echo "  \"accepted\": $accepted,"
            echo "  \"note\": \"An APK is accepted evidence for a revision only when the required product gates passed for that revision. accepted:false means candidate-only or absent, never validated.\""
            echo "}"
          } > android-acceptance/acceptance.json
          cat android-acceptance/acceptance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
