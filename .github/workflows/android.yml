name: android

# Called from product.yml as a job (`uses: ./.github/workflows/android.yml`) so
# that Android inherits the caller's DAG, artifact, and commit association.
# `workflow_dispatch` is kept so the platform evidence can be re-proven on its
# own without touching the product gates.
#
# The earlier version of this workflow ran independently and located the
# product run for its own commit before packaging. That required inferring a
# SHA, authenticating the `gh` CLI, and polling another workflow -- and it
# failed three different ways in review (unauthenticated gh, `gh run list`
# defaulting to the default branch, and GITHUB_SHA being the pull_request merge
# commit while the run index is keyed by the branch head). Being called removes
# the whole mechanism: `needs:` in the caller is the contract, and `explorer-dist`
# is an artifact of the same workflow invocation.
on:
  workflow_call:
  workflow_dispatch:

# The caller already scopes this to contents: read. Declared here so a manual
# dispatch is not more privileged than a called run. No `actions: read` is
# needed: the bundle comes from the same run, not from a looked-up one.
permissions:
  contents: read

# The emulator image, defined once.
#
# The action's inputs and the system-image cache key are both built from these,
# because a cache key that can drift from the configuration it caches is a cache
# that silently restores the wrong image. Hardcoding the identifier in both places
# is how that happens.
env:
  ANDROID_API_LEVEL: "34"
  ANDROID_TARGET: google_apis
  ANDROID_ARCH: x86_64

# This workflow proves platform facts. It does not re-prove that the repository
# is sound: the product gates it is called after have already done that for this
# commit, and the caller only invokes it once they pass. The previous version
# ran `pnpm verify` here as well, which cost 1158s of a 1451s job to assemble an
# APK that takes 39s.
#
# The evidence ladder stays explicit and unchanged:
#
#   1. explorer-dist is the bundle the browser lane passed against
#   2. the checked-in android/ project matches it            (android-sync)
#   3. a debug APK is produced                              (android-assemble)
#   4. Android's own static analysis passes                 (android-lint)
#   5. it installs, launches, stays alive, does not crash    (android-install-launch)
#
# Nothing beyond launch is claimed. Native filesystem, share, and device
# integration remain unvalidated, as before.

jobs:
  # Records what the caller decided and whether this lane has work. Kept as a job
  # rather than a step so the `apk` job's conditional inputs can key off it, and
  # so a manual dispatch of this workflow still reports the plan.
  plan:
    runs-on: ubuntu-latest
    # The packaging and runtime jobs gate on this, and a job's `if` can only read
    # another job's *outputs*, never its step outputs.
    outputs:
      android_apk_has_work: ${{ steps.plan.outputs.android_apk_has_work }}
      android_runtime_has_work: ${{ steps.plan.outputs.android_runtime_has_work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - name: Plan the Android lane
        id: plan
        env:
          DEE_IMPACT_BASE: ${{ env.impact_base }}
        run: pnpm ci:plan android-apk android-runtime

  # Gated on impact. Android packaging and the emulator smoke cost ~4m55s and
  # ~16m respectively, and neither is relevant to a change that cannot reach the
  # packaged application. The `plan` job above is what decides, and it is
  # reported in the log either way, so a skipped lane is visible rather than
  # merely absent.
  #
  # These checks are not merge-blocking, so a job that does not start cannot
  # remove a gate. The required product checks are unaffected either way.
  apk:
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.android_apk_has_work == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Impact routing diffs this change against the base revision, so both
          # revisions must be present. Depth 1 would make every change
          # unresolvable, which routes to full validation -- safe, but it would
          # silently disable the whole feature.
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "21"

      # validation-unit: android-sync
      # Same workflow invocation, so no run id and no token: this is the exact
      # bundle the browser lane validated, not a rebuild of it. Routing keeps
      # `build` alongside this lane: `expandNeeds` closes over the manifest's
      # `needs` edges, so if Android is required then the artifact exists.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: explorer-dist
          path: apps/explorer/dist

      - name: Capacitor sync against the validated bundle
        if: needs.plan.outputs.android_apk_has_work == 'true'
        run: pnpm --filter @digital-evolution/explorer exec cap sync android
      - name: Detect Capacitor drift (checked-in android/ is authoritative)
        run: git diff --exit-code -- apps/explorer/android

      - name: Resolve Android SDK path (single variable for cache + sdkmanager)
        run: echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      # The SDK root is deliberately NOT cached. Caching it was tried and cannot
      # work: the image contains special files that tar cannot recreate with
      # correct ownership, so every restore failed with
      #   "Cannot utime: Operation not permitted" / "Cannot change mode"
      # and the cache was therefore never populated. The sdkmanager step below
      # was the real fallback all along, so the cache bought nothing and cost a
      # ~152s re-download per run. See #50.
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      # Gradle-aware caching. The key includes the wrapper properties, so a
      # toolchain change invalidates the cache rather than reusing build state
      # produced by a different Gradle. Caches are advisory: a miss costs time,
      # never correctness.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/explorer/android/gradle/wrapper/gradle-wrapper.properties', 'apps/explorer/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      # validation-unit: android-assemble
      - name: Assemble debug APK (packaging evidence only)
        working-directory: apps/explorer/android
        run: ./gradlew assembleDebug --no-daemon
      # validation-unit: android-lint
      - name: Android lint (debug)
        working-directory: apps/explorer/android
        run: ./gradlew lintDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digital-evolution-debug-apk
          path: apps/explorer/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Runtime evidence (separate from assembly): install + launch the APK.
  # Claim ladder stays explicit: "assembled" (apk job) vs
  # "installs and launches" (this job). Native behaviors beyond launch
  # are not covered here.
  emulator-smoke:
    runs-on: ubuntu-latest
    needs: [plan, apk]
    # Non-gating by policy, and the single most expensive step in CI. Impact
    # routing keeps it off runs that cannot reach the packaged application.
    if: needs.plan.outputs.android_runtime_has_work == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The system image is the emulator action's largest download and is spent
      # BEFORE the emulator starts, so it is visible as a distinct cost in the
      # log: 62s of a 636s job on main.
      #
      # This caches the image directory, deliberately, and not the SDK root. The
      # whole-SDK cache was tried and cannot work: the SDK root contains special
      # files that tar cannot recreate with correct ownership, so every restore
      # failed with "Cannot utime: Operation not permitted" and the cache was
      # never populated -- a 152s-per-run cost behind a fallback that already
      # worked. `system-images/` is ordinary files, so it is a different failure
      # mode rather than a narrower version of the same one. See #50.
      #
      # Advisory: a miss costs one download, never correctness. The key includes
      # the image identifier, so changing api-level, target, or arch invalidates
      # it instead of restoring a mismatched image.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.ANDROID_HOME }}/system-images
          # Separator-free on purpose: actions/cache keys end up in internal
          # paths and header values, and the canonical image identifier contains
          # semicolons. android34-google_apis-x86_64 is the same identity, safely.
          key: android-system-images-${{ runner.os }}-android${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_TARGET }}-${{ env.ANDROID_ARCH }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: digital-evolution-debug-apk
          path: /tmp/apk
      # validation-unit: android-install-launch
      #
      # Two phases, and a red must say which one failed:
      #
      #   phase 1, infrastructure -- the emulator is usable (adb is in `device`
      #     state and boot completed). Until that holds, nothing is known about
      #     the application.
      #   phase 2, application -- install, launch, aliveness, crash check. Only
      #     reached once phase 1 passed.
      #
      # The phases stay in one job deliberately. Splitting them into two jobs
      # would boot the emulator twice, and boot is ~15 of this job's ~17
      # minutes, so job-level separation would roughly double a lane that is
      # already the slowest thing in CI. The classification is therefore carried
      # explicitly. See #50 -- the acceptance criterion is that a red reliably
      # distinguishes the two.
      #
      # The single title lives in exactly one place, on purpose. Each phase writes
      # which one failed to /tmp/dee-phase and prints a plain
      # `PHASE n FAILED (...)` diagnostic with the exact cause; only the final
      # `Classify Android runtime outcome` step emits a titled `::error`. Having
      # the script raise a title too meant every red produced two, each phrased
      # as though it were the authoritative verdict. The step log keeps the
      # detail, the classifier owns the one classification.
      #
      # `continue-on-error` is required for that, because the action's own boot
      # wait fails *before* the script runs, so a script-only phase marker would
      # never be written in exactly the case that needs it most.
      - name: Emulator smoke (install + launch MainActivity)
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          # API 34: smallest image that still satisfies minSdk 24 with headroom
          # under targetSdk 36. API 35 first-boots took ~10 min and timed out
          # or broke adbd twice (see PR #51 CI history) — boot cost dominates
          # this job, so image size matters more than API recency for an
          # install+launch smoke.
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          disable-animations: true
          # Fast-boot flags for headless runners; boot timeout raised to
          # match observed ~10-minute cold boots with margin.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 1200
          # NOTE: this action executes the script line-by-line (each line
          # via its own sh), so every command below must be a single line —
          # no multi-line for/if blocks (proven by a real CI failure).
          #
          # /tmp/dee-phase is read by the classification step after this action
          # returns. It is written on every terminal path, including the ones
          # where the action's own boot wait has already given up (in which case
          # it is absent, and absent is treated as infrastructure).
          script: |
            echo "unknown" > /tmp/dee-phase
          # MEASURE FROM THIS FILE, NOT FROM THE LOG.
          #
          # This action echoes every line of the script before running it, so
          # every string below appears in the log at least twice: once as source
          # and once as output. Grepping the log for a phase marker cannot tell
          # them apart, and has twice produced a plausible-looking wrong number
          # here -- one of them a *negative* duration, caught only because a
          # negative is impossible. Timestamps do not rescue it either: the whole
          # script is printed up front, so "this line ran" is timestamped at
          # action start regardless of when it actually executed.
          #
          # So each phase appends a record here, written at the moment it runs.
          # Parse this file. Treat the log as prose for humans only.
          # The file is uploaded as an artifact so the timing evidence is durable
          # instead of reconstructed by whoever reads the log next.
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) PHASE-START-1 infrastructure" >> /tmp/dee-phases
            if [ "$(adb get-state 2>/dev/null)" != "device" ]; then echo "infrastructure" > /tmp/dee-phase; echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) PHASE-1 infrastructure FAILED adb-not-device" >> /tmp/dee-phases; echo "PHASE 1 FAILED (infrastructure): adb never reached device state (got '$(adb get-state 2>&1 | head -1)'). The emulator was not usable, so no application claim was made."; exit 1; fi
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; then echo "infrastructure" > /tmp/dee-phase; echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) PHASE-1 infrastructure FAILED boot-not-completed" >> /tmp/dee-phases; echo "PHASE 1 FAILED (infrastructure): emulator did not finish booting. The device was not usable, so no application claim was made."; exit 1; fi
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) PHASE-1 infrastructure PASS" >> /tmp/dee-phases
            echo "Android infrastructure phase: PASS (adb device, boot completed)"
            echo "application" > /tmp/dee-phase
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) PHASE-START-2 application" >> /tmp/dee-phases
            adb install /tmp/apk/app-debug.apk
            adb logcat -c
            adb shell am start -n com.digitalevolution.explorer/.MainActivity
            for i in $(seq 1 30); do if adb shell pidof com.digitalevolution.explorer >/dev/null; then break; fi; sleep 2; done
            APP_PID=$(adb shell pidof com.digitalevolution.explorer | tr -d '\r'); if [ -z "$APP_PID" ]; then echo "PHASE 2 FAILED (application): the emulator was usable but the app did not stay alive after MainActivity started."; exit 1; fi
            if adb logcat -d --pid="$APP_PID" | grep -q "FATAL EXCEPTION"; then echo "PHASE 2 FAILED (application): the app threw a FATAL EXCEPTION after launch."; adb logcat -d --pid="$APP_PID" | grep -A8 "FATAL EXCEPTION" | head -40; exit 1; fi
            echo ok > /tmp/dee-phase
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) PHASE-2 application PASS" >> /tmp/dee-phases
            echo "Android application phase: PASS (MainActivity alive, no fatal exceptions)"

      # The phase record, as an artifact. Without it the timing evidence exists
      # only inside a log that cannot be parsed reliably, and the next person
      # reconstructs it by hand from echoed script text.
      - name: Upload Android phase record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-phase-record
          path: /tmp/dee-phases
          if-no-files-found: ignore
          retention-days: 30

      # Turns whatever happened above into exactly one classification. This step
      # exists so that a red on this job is never ambiguous: it either means the
      # emulator was unusable (infrastructure) or the app failed (application),
      # and says which in a titled annotation rather than leaving it to be
      # inferred from a timeout.
      - name: Classify Android runtime outcome
        if: always()
        run: |
          set -uo pipefail
          phase=$(cat /tmp/dee-phase 2>/dev/null || echo unknown)
          if [ "${{ steps.emulator.outcome }}" = "success" ]; then
            echo "Android runtime: infrastructure and application phases both passed"
            exit 0
          fi
          if [ "$phase" = "application" ]; then
            echo "::error title=Android application failure::The emulator was usable and the application phase failed. This red is a product or runtime failure."
            exit 1
          fi
          echo "::error title=Android infrastructure failure::The emulator never became usable (phase: $phase), so the application was never tested and no product claim can be drawn from this run. This red is a runner or image problem, not a product failure."
          exit 1
