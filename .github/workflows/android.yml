name: android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Needed to look up the product run for this exact commit. Read-only.
  actions: read

# A new push cancels stale runs on the same ref: only the latest state
# consumes runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow proves platform facts. It does not re-prove that the repository
# is sound: `product` already ran the full blocking contract for this commit,
# and this workflow refuses to build unless that run exists and succeeded. The
# previous version ran `pnpm verify` here as well, which cost 1158s of the job's
# 1451s to assemble an APK that takes 43s. The evidence ladder is unchanged:
#
#   1. explorer-dist is the bundle the browser lane passed against
#   2. the checked-in android/ project matches it          (android-sync)
#   3. a debug APK is produced                            (android-assemble)
#   4. Android's own static analysis passes               (android-lint)
#   5. it installs, launches, stays alive, and does not crash (android-install-launch)
#
# Nothing beyond launch is claimed. Native filesystem, share, and device
# integration remain unvalidated, as before.

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-project
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "21"

      # The gate this workflow depends on. Resolving the product run by commit
      # keeps the evidence association unambiguous: an APK is only ever built
      # from a revision whose blocking product validation passed.
      - name: Require a passing product run for this commit
        id: product
        env:
          # The runner ships `gh` but does not authenticate it. Without this the
          # lookup fails instantly and, under `set -e`, the gate dies before it
          # has checked anything.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOT `github.sha`. On a pull_request event GITHUB_SHA is the *merge*
          # commit, but the workflow-run index is keyed by the *head* commit of
          # the branch, so querying by GITHUB_SHA returns zero runs forever --
          # which is a 30-minute wait ending in a failure that looks like the
          # product run never happened. On push events github.sha is already
          # the head commit.
          PRODUCT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          echo "waiting for a product run on $PRODUCT_SHA"
          lookup_failures=0
          for attempt in $(seq 1 90); do
            # Query the API by head_sha rather than using `gh run list`.
            # `gh run list` defaults to the DEFAULT BRANCH, so it looks for runs
            # that can never appear when filtered by a pull_request SHA.
            #
            # A failed lookup is not the same as "no run yet": the run may not
            # have started. Retry a few times, then stop, rather than either
            # dying on a transient error or polling for half an hour behind a
            # real permissions problem.
            if ! found=$(gh api "repos/{owner}/{repo}/actions/workflows/product.yml/runs?head_sha=$PRODUCT_SHA&per_page=20" \
                           --jq '[.workflow_runs[] | select(.status == "completed")] | sort_by(.run_number) | reverse | .[0] // empty | {id, conclusion}' 2>&1); then
              lookup_failures=$((lookup_failures + 1))
              echo "attempt $attempt: could not query workflow runs: $found"
              if [ "$lookup_failures" -ge 5 ]; then
                echo "::error::repeatedly failed to query workflow runs; check that the job's token has 'actions: read'."
                exit 1
              fi
              sleep 20
              continue
            fi
            if [ -n "$found" ] && [ "$found" != "null" ]; then
              run_id=$(echo "$found" | jq -r .id)
              conclusion=$(echo "$found" | jq -r .conclusion)
              if [ "$conclusion" != "success" ]; then
                echo "::error::product workflow run $run_id concluded '$conclusion' for $PRODUCT_SHA; refusing to package unvalidated source."
                exit 1
              fi
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Using product run $run_id (success) for $PRODUCT_SHA"
              exit 0
            fi
            echo "attempt $attempt: no completed product run for $PRODUCT_SHA yet; waiting 20s"
            sleep 20
          done
          echo "::error::no completed product run found for $PRODUCT_SHA after 30 minutes; cannot prove this revision passed the product gates."
          exit 1

      # validation-unit: android-sync
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: explorer-dist
          path: apps/explorer/dist
          run-id: ${{ steps.product.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Capacitor sync against the validated bundle
        run: pnpm --filter @digital-evolution/explorer exec cap sync android
      - name: Detect Capacitor drift (checked-in android/ is authoritative)
        run: git diff --exit-code -- apps/explorer/android

      - name: Resolve Android SDK path (single variable for cache + sdkmanager)
        run: echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: android-sdk-36-${{ runner.os }}-v2
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      # Gradle-aware caching. The key includes the Gradle wrapper properties, so
      # a toolchain change invalidates the cache rather than reusing build state
      # produced by a different Gradle. Caches are advisory: a miss costs time,
      # never correctness.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/explorer/android/gradle/wrapper/gradle-wrapper.properties', 'apps/explorer/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      # validation-unit: android-assemble
      - name: Assemble debug APK (packaging evidence only)
        working-directory: apps/explorer/android
        run: ./gradlew assembleDebug --no-daemon
      # validation-unit: android-lint
      - name: Android lint (debug)
        working-directory: apps/explorer/android
        run: ./gradlew lintDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digital-evolution-debug-apk
          path: apps/explorer/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Runtime evidence (separate from assembly): install + launch the APK.
  # Claim ladder stays explicit: "assembled" (apk job) vs
  # "installs and launches" (this job). Native behaviors beyond launch
  # are not covered here.
  emulator-smoke:
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: digital-evolution-debug-apk
          path: /tmp/apk
      # validation-unit: android-install-launch
      - name: Emulator smoke (install + launch MainActivity)
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          # API 34: smallest image that still satisfies minSdk 24 with headroom
          # under targetSdk 36. API 35 first-boots took ~10 min and timed out
          # or broke adbd twice (see PR #51 CI history) — boot cost dominates
          # this job, so image size matters more than API recency for an
          # install+launch smoke.
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Fast-boot flags for headless runners; boot timeout raised to
          # match observed ~10-minute cold boots with margin.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 1200
          # NOTE: this action executes the script line-by-line (each line
          # via its own sh), so every command below must be a single line —
          # no multi-line for/if blocks (proven by a real CI failure).
          script: |
            adb install /tmp/apk/app-debug.apk
            adb logcat -c
            adb shell am start -n com.digitalevolution.explorer/.MainActivity
            for i in $(seq 1 30); do if adb shell pidof com.digitalevolution.explorer >/dev/null; then break; fi; sleep 2; done
            APP_PID=$(adb shell pidof com.digitalevolution.explorer | tr -d '\r'); if [ -z "$APP_PID" ]; then echo "Android runtime smoke FAILED: app did not stay alive"; exit 1; fi
            if adb logcat -d --pid="$APP_PID" | grep -q "FATAL EXCEPTION"; then echo "Android runtime smoke FAILED: fatal exception after launch"; adb logcat -d --pid="$APP_PID" | grep -A8 "FATAL EXCEPTION" | head -40; exit 1; fi
            echo "Android runtime smoke: MainActivity alive, no fatal exceptions"
