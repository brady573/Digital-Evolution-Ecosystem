name: repo-ai-v1

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build repo-ai
        run: go build -trimpath -o "$RUNNER_TEMP/repo-ai" ./cmd/repo-ai

      - name: Governance check
        run: "$RUNNER_TEMP/repo-ai" check --format=github

      - name: Go tests
        run: go test ./...
