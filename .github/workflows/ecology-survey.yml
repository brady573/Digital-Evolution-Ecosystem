name: ecology-survey

on:
  workflow_dispatch:
    inputs:
      ticks:
        description: "Ticks per survey world"
        required: false
        default: "250000"

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-project
      - run: pnpm test:survey -- --ticks=${{ inputs.ticks }} --full --out=ecology-survey.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecology-survey-results
          path: ecology-survey.json
          if-no-files-found: error
          retention-days: 30
