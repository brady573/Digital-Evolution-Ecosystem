name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Pin to full SHA before production release
      - uses: actions/setup-go@v5 # Pin to full SHA before production release
        with:
          go-version: '1.23'
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/repo-ai
