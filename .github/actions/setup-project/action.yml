name: setup project
description: >-
  Canonical CI bootstrap: Node, corepack, pnpm, the pnpm store cache, and a
  frozen install. One place to change the toolchain, so a toolchain bump stops
  being a seven-job edit.

# Why this exists
#
# Every job used to repeat this sequence by hand, which meant a pnpm or Node
# bump had to land seven times or the jobs quietly disagreed. It also meant the
# install cost was invisible: nothing recorded how long bootstrap took, so the
# number had to be dug out of step timings by hand.
#
# What it deliberately does NOT do
#
# It does not artifact `node_modules`. pnpm hardlinks from a content-addressed
# store, and the store cache already makes a frozen install take about a second
# (measured: 1s on `ubuntu-latest`). Restoring a captured install tree would
# optimise a step that is already free and would trade that for a real risk of
# accepting a tree that does not match the lockfile.

# Every job must run `actions/checkout` before this action. A local action is
# resolved from the workspace on disk, and before a checkout there is no
# workspace, so the job fails immediately with "Can't find 'action.yml'".
# Checkout is therefore deliberately not a step in here: a job that wants only
# the pnpm store should not be forced to take a repository it does not read.

inputs:
  node-version:
    description: Node version, from .nvmrc conventions.
    required: false
    default: "24"
  pnpm-version:
    description: pnpm version, pinned in the root packageManager field.
    required: false
    default: "12.5.1"
  install:
    description: Run the frozen install. Set false for jobs that only need the store.
    required: false
    default: "true"

outputs:
  setup-seconds:
    description: Wall time of this action, for the validation cost report.
    value: ${{ steps.timing.outputs.seconds }}

runs:
  using: composite
  steps:
    - name: Record bootstrap start
      id: start
      shell: bash
      run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        # The store is cached explicitly below, keyed on the lockfile, so that a
        # dependency change invalidates it and a toolchain-only change does not.
        package-manager-cache: false

    - name: Enable pnpm
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@${{ inputs.pnpm-version }} --activate

    - name: Pnpm store path
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Record bootstrap duration
      id: timing
      shell: bash
      run: |
        start=${{ steps.start.outputs.epoch }}
        echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
